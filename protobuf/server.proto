syntax = "proto3";

package foxscream;

import "common.proto";

// Messages that the server sends to the client, this is used to establish a connection and send data to the client.
message ServerToClient {
    oneof message {
        ServerHello server_hello = 1;
        SessionInfo session_info = 2;
        SessionInfoUpdate session_info_update = 3;
        User user_update = 4;
        Message message_update = 5;
        ResourceRemoved resource_removed = 6;
        TalkingStateUpdate talking_state_update = 7;
        foxscream.RequestSdpOffer request_sdp_offer = 8;
        foxscream.SdpOffer sdp_offer = 9;
        foxscream.SdpAnswer sdp_answer = 10;
        foxscream.IceCandidate ice_candidate = 11;
        foxscream.ExtensionMessage extension_message = 12;
    }
}

// The server hello message is sent by the server to the client when a connection is established.
message ServerHello {
    // The protocol name that the server is using, for Foxscream this is always "com.kitsuvm.foxpurr.foxscream".
    string protocol = 1;
    // The protocol version that the server is using.
    foxscream.Version protocol_version = 2;
    // The features that the server supports, this is used to disable features on client when the server does not support them.
    Features features = 3;
    // The extensions that the server supports, this is used to extend the protocol with new features.
    map<string, foxscream.Extension> extensions = 4;
    // The server name that the client is connecting to, this is usually the display name of the software that is running the server.
    string server = 5;
    // The unique identifier of the software that is running the server like "com.example.software".
    string server_id = 6;
    // The version of the software that is running the server.
    foxscream.Version server_version = 7;
}

// Describes the features that the server supports, this is used to disable features on client when the server does not support them.
message Features {
    // The server supports screen sharing.
    bool screen_sharing = 1;
    // The server supports camera.
    bool camera = 2;
    // The server supports chat.
    bool chat = 3;
    // The server supports file transfer.
    bool file_transfer = 4;
    // The server is using a Selective Forwarding Unit (SFU).
    bool sfu = 5;
}

// Describes the configuration for WebRTC connections, this is used to establish peer-to-peer connections between clients.
message WebRTCConfig {
    // The TURN server that the client should use to establish a connection with other clients.
    string turn = 1;
    // The STUN server that the client should use to establish a connection with other clients.
    string stun = 2;
    // If the server is using a Selective Forwarding Unit (SFU) to relay media streams between clients.
    bool sfu = 3;
}

// Describes the session information that the server sends to the client when a connection is established.
message SessionInfo {
    // The timestamp of when the session information was sent, this is usually a UNIX timestamp in milliseconds.
    uint64 timestamp = 1;
    // The configuration for WebRTC connections, this is used to establish peer-to-peer connections between clients.
    WebRTCConfig webrtc_config = 2;
    // The users that are currently connected to the server, this is used to display the list of users in the client.
    repeated User users = 3;
    // The messages that are currently in the session, this is used to display the chat history in the client.
    repeated Message messages = 4;
    // The extension data of the session, this is used to send arbitrary data to the client.
    map<string, bytes> extension_data = 5;
}

// Describes a user that is connected to the server.
message User {
    // The unique identifier of the user like Snowflake ID or UUID.
    string id = 1;
    // The human-readable name of the user.
    string name = 2;
    // The timestamp of when the user connected to the server, this is usually a UNIX timestamp in milliseconds.
    uint64 timestamp = 3;
    // The URL of the user's avatar, this is usually a link to an image that represents the user.
    string avatar_url = 4;
    // If the user has microphone enabled.
    bool microphone = 5;
    // If the user has camera enabled.
    bool camera = 6;
    // If the user has screen sharing enabled.
    bool screen_sharing = 7;
    // The file transfer information of the user.
    repeated FileTransferInfo file_transfer_info = 8;
}

// Describes the file transfer information of a user, this is used to display the list of files that a user is transferring.
message FileTransferInfo {
    // User-defined unique identifier for the file transfer, this is used to identify the file transfer in the server and client.
    uint32 id = 1;
    // The name of the file that the user is transferring.
    string file_name = 2;
    // The size of the file that the user is transferring in bytes.
    uint64 file_size = 3;
    // The timestamp of when the file transfer was started, this is usually a UNIX timestamp in milliseconds.
    uint64 timestamp = 4;
}

// Describes a message that is sent between users, this is used to send chat messages between users.
message Message {
    // The unique identifier of the message like Snowflake ID or UUID.
    string id = 1;
    // The content of the message, this is usually a string but can be any type of data.
    string content = 2;
    // The unique identifier of the user that sent the message like Snowflake ID or UUID.
    string sender_id = 3;
    // The timestamp of when the message was sent, this is usually a UNIX timestamp in milliseconds.
    uint64 timestamp = 4;
    // The URL of the attachment that is sent with the message, this is usually a link to a file that is sent with the message.
    string attachment_url = 5;
    // The type of the attachment that is sent with the message.
    foxscream.AttachmentType attachment_type = 6;
}

// Describes a session information update that the server sends to the client when the session information changes.
message SessionInfoUpdate {
    // The configuration for WebRTC connections, this is used to establish peer-to-peer connections between clients.
    WebRTCConfig webrtc_config = 1;
}

// Describes a resource that was removed from the session, this is used to update the client when a user or message is removed from the session.
message ResourceRemoved {
    // The type of the resource that was removed, this is used to determine how to handle the removed resource in the client.
    ResourceType type = 1;
    // The unique identifier of the resource that was removed like Snowflake ID or UUID.
    string id = 2;
}

// Describes the type of resource that was removed from the session, this is used to determine how to handle the removed resource in the client.
enum ResourceType {
    // The resource type is unknown, this is used when the resource type is not specified.
    RESOURCE_TYPE_UNSPECIFIED = 0;
    // The resource is a user.
    RESOURCE_TYPE_USER = 1;
    // The resource is a message.
    RESOURCE_TYPE_MESSAGE = 2;
}

// Describes the message that the server sends to the client when a user starts or stops talking.
message TalkingStateUpdate {
    // The unique identifier of the user that is talking like Snowflake ID or UUID.
    string user_id = 1;
    // If the user is talking or not.
    bool talking = 2;
}
