syntax = "proto3";

package foxscream;

// Describes the type of attachment that is sent with a message, this is used to determine how to display the attachment in the client.
enum AttachmentType {
    // The attachment type is unknown, this is used when the attachment type is not specified.
    ATTACHMENT_TYPE_UNSPECIFIED = 0;
    // The attachment is an image.
    ATTACHMENT_TYPE_IMAGE = 1;
    // The attachment is a video.
    ATTACHMENT_TYPE_VIDEO = 2;
    // The attachment is a file.
    ATTACHMENT_TYPE_FILE = 3;
}

// Describes an extension that can be used by clients to extend the protocol.
message Extension {
    // The human-readable name of the extension like "Example Extension".
    string name = 2;
    // The version of the extension.
    Version version = 3;
}

// Describes arbitrary data that can be sent between the server and client, this is used to extend the protocol with new features.
message ExtensionMessage {
    // The unique identifier of the extension that is sending the data, this is used to determine which extension the data belongs to.
    string id = 1;
    // The arbitrary data that is sent between the server and client, this is used to extend the protocol with new features.
    bytes data = 2;
}

// Describes the version of something on the protocol.
message Version {
    // The major version number. This is incremented when there are breaking changes to the software.
    uint32 major = 1;
    // The minor version number. This is incremented when there are new features added to the software.
    uint32 minor = 2;
    // The raw version string used for display purposes.
    string raw = 3;
}

// Describes the message that is sent between the server and client when a SDP offer is being requested.
message RequestSdpOffer {
    // The unique identifier of the user that's requesting or to receive the SDP offer request.
    string user_id = 1;
}

// Describes the message that is sent between the server and client for responding to a SDP offer request.
message SdpOffer {
    // The unique identifier of the user that is sending or to send the SDP offer to.
    string user_id = 1;
    // The SDP offer, this is used to establish a WebRTC connection.
    string sdp_offer = 2;
    // The media ID of the microphone stream, this is used to identify the media stream for the microphone in the WebRTC connection.
    string microphone_mid = 3;
    // The media ID of the camera stream, this is used to identify the media stream for the camera in the WebRTC connection.
    string camera_mid = 4;
    // The media ID of the screen sharing stream, this is used to identify the media stream for screen sharing in the WebRTC connection.
    string screen_sharing_mid = 5;
    // The mapping of file transfer IDs to their corresponding media IDs, this is used to identify the media streams for file transfers in the WebRTC connection.
    map<uint32, string> file_transfer_mids = 6;
}

// Describes the message that is sent between the server and client for responding to a SDP offer.
message SdpAnswer {
    // The unique identifier of the user that is sending or to send the SDP answer to.
    string user_id = 1;
    // The SDP answer, this is used to establish a WebRTC connection.
    string sdp_answer = 2;
}

// Describes the message that is sent between the server and client for sending ICE candidates.
message IceCandidate {
    // The unique identifier of the user that is sending or to send the ICE candidate to.
    string user_id = 1;
    // The ICE candidate string, this is used to establish a WebRTC connection.
    string ice_candidate = 2;
}
